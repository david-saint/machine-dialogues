    Background. On the All-In podcast, investor Gavin Baker relayed a claim circulating in Silicon Valley that Dario Amodei had said Anthropic might end up "the only private company left." On 15 Aug 2026 Anthropic researcher Sholto Douglas called this "completely false," said economic concentration of power is "one of the things we are _most_ worried about," that "there is no world where the government should let any company have that much influence," that "the AI market is literally the most competitive market in the world right now," and linked Amodei's essay on the subject.

    Gavin Baker (15 Aug, reply to Douglas). Thanks him; says multiple serious people believe the story because it is consistent with Amodei's public messaging (AI might be dangerous, could concentrate economic power, needs thoughtful regulation), which Baker believes is made in good faith. Frames the choice: "Either concentrate it in the hands of a chosen few companies and politicians via regulation or distribute it widely" — "whether one believes AI is too dangerous to concentrate or too dangerous to distribute." Quotes Mark Zuckerberg: "The notion that AI is so dangerous that the only safe path is an extreme concentration of power seems inherently problematic. Historically, hoping that an absolute power will benevolently provide for humanity if sufficiently enlightened has not led to safe or positive outcomes." Wants "as many AIs as possible to maximize the odds that one shares my own particular values," and cites Amodei's own observation that "no human has ever been able to take over the world." Claims "Dario has lost the argument": his preferred regulatory path has not materialized; a recent incident in which an unreleased advanced OpenAI model hacked Hugging Face was, per Baker, resolved only by an open-source model, which "likely ended any chance of strict near-term regulation"; "essentially every major company other than Anthropic has signed Jensen's letter" (an industry letter associated with Jensen Huang). Says Amodei's messaging has been "massively helpful" to efforts to ban datacenters in America and predicts anti-datacenter ads built from clips of Amodei warning about AI. Wants a cured-disease, "Star Trek like" abundant future and thinks Amodei is now decreasing its odds. Notes Amodei is about to be CEO of one of the most important public companies in the world and, since the pro-regulatory effort has failed "at least for now," should be "a more positive advocate for his own industry." Adds that Anthropic has "deep competitive advantages" and that months earlier the main risk he saw to Anthropic was nationalization "as a result of Dario's own rhetoric and behavior."

    Sholto Douglas (15 Aug, reply). Agrees with much. Cyber is "ultimately defence dominant": with ~2 years of work (every financial institution and critical-infrastructure provider white-hat hacking itself) he would have "0 concern for any open coding model"; accepting more cyber risk for no imposition on freedom is a reasonable interim choice, but "the USG should be in a position to actively make that choice having measured and evaluated the risks for themselves." Bio is "offence dominant" and fixing that "will probably take well into the 2030s" — a "world leading virologist in your pocket"; society may decide the risk is worth it, but the government should stand up an arm to run uplift trials ("see if AI helps them more than YouTube access," "test what the worst thing someone could do with 200k and a garage is") and decide at each capability level. Says the risk talk exists because "we've wanted to be honest with people," e.g. employment: he disagrees with Amodei on pace — models able to automate ~95% of computer-facing jobs by 2028, but compute shortages, diffusion complexity, policy and unmet demand mean people keep working well into the 2030s — yet society should prepare contingency policies (e.g. not letting profitable companies lay off more than 5% per year) and METR-style evals by job family. Concedes: "as both a company and an industry we have utterly failed to present a positive picture of a future people want to fight for, and that this is actively decreasing our chance of getting to that future." Says Zuckerberg's essay "doesn't engage with the actually hard part of the problem, which is that inequality of compute will matter far more than open models."

    Baker follow-up (15 Aug). Calls the cyber-defence/bio-offence framing sensible and the bio point "probably the best pro-regulation argument"; agrees the USG should have all information necessary "as cards are turned over." Thinks compute shortages plus high DRAM prices may be "civilizationally useful" in slowing a fast takeoff; humans (a 15–20-watt brain) stay economically useful even in an AGI-maximalist scenario. Compute inequality "is absolutely going to be a massive, massive issue," but the answer is to "grow the pie so fast that even the bottom of the income/compute distribution are much better off here in America than almost anywhere else." Douglas: "1000% agree"; median expectation is compute spend on a 2–3x/yr trendline (>$2T next year) and a given level of intelligence getting ~10x cheaper each year.

    Dario Amodei (15 Aug, two posts quoting Baker). Post 1: the "concentrate via regulation or distribute widely" framing is "a false choice." The Silicon Valley shorthand "regulation = regulatory capture = concentration of power" is "an overly simplified picture"; those in that frame "underrate the decentralizing power of objective and fair institutional processes" — courts vs mob justice; "at their best, institutions can vest power in ideas rather than people, and thereby decentralize that power." Anthropic deliberately makes proposals that "disadvantage (slow down) frontier AI companies while *advantaging* smaller competitors": California SB 53 (Anthropic supported) exempts companies below $500M revenue; SB 1047 (Anthropic was ambivalent) had a lower threshold Anthropic objected to; the testing process Anthropic advocated at CAISI and the White House applies more rigorous tests to frontier than off-frontier models; the "Pacing the Frontier" letter (in Anthropic's preferred implementation) modulates the pace of the very best models while not constraining those catching up — "This hurts the business interests of the frontier labs and helps challengers, including open-weights!" AI is "*structurally* a technology that tends to concentrate power" because of the scaling laws, not because of regulation; open weights help some but "simply shift the concentration somewhat to those with the most compute and chips (which are roughly the frontier labs plus maybe hardware providers)." The right "rules of the road" can (a) address cyber/bio/alignment risks, (b) institutionally constrain frontier labs, and (c) leave room for open weights while addressing their specific risks. Denies losing: the Trump administration's reported approach — pre-deployment testing for frontier models, and testing of open-weights models when they get close to the frontier — is one he is "very supportive of," pending details; he also supports Demis Hassabis's idea of a FINRA-like entity; six months ago most of the industry pushed preemption of all state regulation with no federal approach. Post 2: his messaging has been "about equally balanced" — one major essay on risks and one on benefits; short clips skew negative because negativity gets clicks; he wrote *Machines of Loving Grace* because the industry wasn't painting an inspiring enough picture, arguing most human disease could be cured in ~5–10 years; *Policy on the AI Exponential* proposes streamlining the FDA; his father died of Hepatitis C a few years before sofosbuvir. Public negativity is a decades-old "crisis of trust" in companies, governments and tech, not caused by AI leaders warning of risk; a "glitzy marketing campaign" won't fix it — "The thing that will work is *actually curing cancer*"; "by far the most accurate criticism of AI companies including Anthropic is that we haven't yet delivered on our big promises," which is the criticism Baker should be making. Anthropic is ramping bio/medicine work; honesty about risk "is the right thing on the merits, and in terms of public credibility and trust it is no worse than, and may in fact be better than," ignoring risks people instinctively know are real.

    Baker reply (15 Aug). Praises the engagement; thinks a 50/50 risk/benefit balance "is perhaps too weighted towards the risks" given human psychology; agrees the best thing the industry can do is "actually cure cancer."

    David Sacks (17 Aug, quoting Amodei's post 1). (1) Amodei "does not actually address Gavin Baker's account of what he said." (2) The "bubble" claim is a straw man — "almost no one holds that view"; Sacks has repeatedly argued for strong antitrust enforcement, especially against Big Tech, and would demand it apply if Anthropic heads toward monopoly or duopoly. (3) Regulatory capture is not vague: George Stigler defined it as regulation acquired by an industry and operated primarily for its benefit; concentrated industry stakes vs the public's diffuse ones; the revolving door — Anthropic "has hired multiple senior Biden AI-policy officials and built a substantial government-affairs operation plus a network of aligned organizations." (4) Amodei has consistently pushed a new federal agency to review and approve frontier models before release — framed as an "FDA for AI," "FAA for AI," most recently a "FINRA for AI"; Sacks calls it a "DMV for AI": long approval queues, rules accumulating against theoretical harms, a handicap versus China; and it "would also undermine Anthropic's own business model, whose pricing power depends on remaining ahead of open models," so it is "difficult to believe the company would simply accept outcomes that erase that advantage." (5) Anthropic will have the resources to navigate any approval process and shape the rules while competitors wait; Amodei wants open models under heavier scrutiny (called them dangerous in Senate testimony, criticized them as not centrally monitored or withdrawable, linked them to IP theft); he says he never sought a ban but "could achieve a similar result by insisting that identical rules apply to both open and closed models"; the U.S. risks becoming "an island of costly closed models." (6) The deeper centralization risk is not chips but "who decides which capabilities are available to whom"; pre-deployment testing plus FAA/FINRA-style oversight "would place that gatekeeping power in a federal bureaucracy working hand-in-glove with a small number of frontier labs." (7) Anthropic ran "well-orchestrated campaigns hyping AI fears": the May 2025 claim that AI would wipe out 50% of entry-level knowledge jobs within five years "still lacks supporting evidence fifteen months later"; the "heavily contrived 'blackmail' study" promoted on 60 Minutes. (8) These narratives shaped public fear more than anything; Zuckerberg's question — why race to build a future you describe so negatively; Sowell's *The Vision of the Anointed*. (9) "Dario believes frontier AI is too powerful to distribute; we believe it is too powerful to centralize." As of 17 Aug there is no reply from Amodei.
